<!DOCTYPE html>
<html lang="en" data-theme="obsidian">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LyricVault</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0e14">
    <link rel="apple-touch-icon" href="https://www.w3.org/TR/appmanifest/images/icon-192.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root[data-theme="obsidian"] {
            --bg-base: #0b0e14;
            --bg-surface: #151a23;
            --bg-elevated: #1e2532;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.4);
            --danger: #ef4444;
        }

        :root[data-theme="neon-matrix"] {
            --bg-base: #050505;
            --bg-surface: #0a0a0a;
            --bg-elevated: #141414;
            --text-primary: #ffffff;
            --text-secondary: #6b7280;
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.4);
            --danger: #ef4444;
        }

        :root[data-theme="forge"] {
            --bg-base: #110c0c;
            --bg-surface: #1c1414;
            --bg-elevated: #2b1d1d;
            --text-primary: #f5ecec;
            --text-secondary: #a39090;
            --accent: #f97316;
            --accent-glow: rgba(249, 115, 22, 0.4);
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* --- Main Screen View --- */
        .home-screen {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 2rem 1.5rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, var(--bg-base) 60%, transparent);
            z-index: 10;
        }

        .brand h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--text-primary), var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .theme-select {
            background-color: var(--bg-surface);
            color: var(--text-secondary);
            border: 1px solid var(--bg-elevated);
            padding: 0.5rem;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            appearance: none;
        }

        .song-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 1.5rem 6rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .song-card {
            background-color: var(--bg-surface);
            border-radius: 20px;
            padding: 1.5rem;
            cursor: pointer;
            border: 1px solid transparent;
            transition: transform 0.2s ease, background-color 0.3s ease, border-color 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .song-card:active {
            transform: scale(0.97);
        }

        .song-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background-color: var(--accent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .song-card:hover::before {
            opacity: 1;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-meta {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 300;
        }

        /* --- Floating Action Button (FAB) --- */
        .fab {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 64px;
            height: 64px;
            border-radius: 24px;
            background-color: var(--accent);
            color: var(--bg-base);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: 300;
            cursor: pointer;
            box-shadow: 0 8px 32px var(--accent-glow);
            z-index: 20;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .fab:active {
            transform: scale(0.9) rotate(15deg);
        }

        /* --- Full Screen Editor (Slide Up) --- */
        .editor-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-base);
            z-index: 100;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            will-change: transform;
        }

        .editor-screen.active {
            transform: translateY(0);
        }

        .editor-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--bg-elevated);
        }

        .btn-icon {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 1.5rem;
            cursor: pointer;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-elevated);
        }

        .btn-icon.danger {
            color: var(--danger);
            background-color: rgba(239, 68, 68, 0.1);
        }

        .editor-body {
            flex: 1;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .input-title {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 2.5rem;
            font-weight: 800;
            outline: none;
            margin-bottom: 1.5rem;
            letter-spacing: -0.5px;
        }

        .input-title::placeholder {
            color: var(--text-secondary);
            opacity: 0.5;
        }

        .input-lyrics {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 1.15rem;
            font-weight: 400;
            line-height: 1.8;
            outline: none;
            resize: none;
        }

        .input-lyrics::placeholder {
            color: var(--text-secondary);
            opacity: 0.3;
        }

        .empty-state {
            text-align: center;
            margin-top: 50%;
            color: var(--text-secondary);
            font-weight: 300;
        }
    </style>
</head>
<body>

    <div class="home-screen" id="home-screen">
        <header>
            <div class="brand">
                <h1>Vault</h1>
            </div>
            <select class="theme-select" id="theme-selector">
                <option value="obsidian">Obsidian</option>
                <option value="neon-matrix">Matrix</option>
                <option value="forge">Forge</option>
            </select>
        </header>

        <div class="song-list" id="song-list">
            </div>

        <div class="fab" id="btn-fab">+</div>
    </div>

    <div class="editor-screen" id="editor-screen">
        <div class="editor-nav">
            <button class="btn-icon" id="btn-back">↓</button>
            <button class="btn-icon danger" id="btn-delete">×</button>
        </div>
        <div class="editor-body">
            <input type="text" class="input-title" id="input-title" placeholder="Track Title...">
            <textarea class="input-lyrics" id="input-lyrics" placeholder="Start tracking vocals..."></textarea>
        </div>
    </div>

    <script>
        // State
        let songs = JSON.parse(localStorage.getItem('lyricVault_songs')) || [];
        let currentSongId = null;

        // Elements
        const songList = document.getElementById('song-list');
        const editorScreen = document.getElementById('editor-screen');
        const inputTitle = document.getElementById('input-title');
        const inputLyrics = document.getElementById('input-lyrics');
        const btnFab = document.getElementById('btn-fab');
        const btnBack = document.getElementById('btn-back');
        const btnDelete = document.getElementById('btn-delete');
        const themeSelector = document.getElementById('theme-selector');

        // Init
        function init() {
            const savedTheme = localStorage.getItem('lyricVault_theme') || 'obsidian';
            document.documentElement.setAttribute('data-theme', savedTheme);
            themeSelector.value = savedTheme;
            renderList();
        }

        // Render List
        function renderList() {
            songList.innerHTML = '';
            
            if (songs.length === 0) {
                songList.innerHTML = '<div class="empty-state">No tracks found. Hit + to start.</div>';
                return;
            }

            songs.forEach((song) => {
                const card = document.createElement('div');
                card.className = 'song-card';
                card.innerHTML = `
                    <div class="card-title">${song.title || 'Untitled Track'}</div>
                    <div class="card-meta">Updated ${song.date}</div>
                `;
                card.onclick = () => openEditor(song.id);
                songList.appendChild(card);
            });
        }

        // Editor Logic
        function openEditor(id = null) {
            currentSongId = id;
            if (id) {
                const song = songs.find(s => s.id === id);
                inputTitle.value = song.title;
                inputLyrics.value = song.lyrics;
            } else {
                inputTitle.value = '';
                inputLyrics.value = '';
            }
            editorScreen.classList.add('active');
        }

        function closeEditor() {
            editorScreen.classList.remove('active');
            inputTitle.blur();
            inputLyrics.blur();
        }

        function saveData() {
            const title = inputTitle.value.trim();
            const lyrics = inputLyrics.value;
            const date = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

            // Don't save if completely empty
            if (!title && !lyrics) return;

            if (currentSongId) {
                const index = songs.findIndex(s => s.id === currentSongId);
                songs[index] = { ...songs[index], title, lyrics, date };
            } else {
                const newSong = { id: Date.now().toString(), title, lyrics, date };
                songs.unshift(newSong);
                currentSongId = newSong.id;
            }

            localStorage.setItem('lyricVault_songs', JSON.stringify(songs));
            renderList();
        }

        function deleteSong() {
            if (!currentSongId) {
                closeEditor();
                return;
            }
            
            if(confirm('Drop this track?')) {
                songs = songs.filter(s => s.id !== currentSongId);
                localStorage.setItem('lyricVault_songs', JSON.stringify(songs));
                currentSongId = null;
                renderList();
                closeEditor();
            }
        }

        // Listeners
        btnFab.addEventListener('click', () => openEditor(null));
        btnBack.addEventListener('click', closeEditor);
        btnDelete.addEventListener('click', deleteSong);

        let timeout;
        const triggerSave = () => {
            clearTimeout(timeout);
            timeout = setTimeout(saveData, 800);
        };

        inputTitle.addEventListener('input', triggerSave);
        inputLyrics.addEventListener('input', triggerSave);

        themeSelector.addEventListener('change', (e) => {
            document.documentElement.setAttribute('data-theme', e.target.value);
            localStorage.setItem('lyricVault_theme', e.target.value);
        });

        // Register Service Worker (PWA functionality)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }

        init();
    </script>
</body>
</html>
